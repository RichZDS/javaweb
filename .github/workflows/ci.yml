name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: 检查有哪些子项目
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      admin: ${{ steps.check.outputs.admin }}
      app: ${{ steps.check.outputs.app }}
      android: ${{ steps.check.outputs.android }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          echo "backend=$([ -f backend/pom.xml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "admin=$([ -f admin/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "app=$([ -f app/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "android=$([ -f android/settings.gradle ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  backend:
    name: 后端（H2 测试 + 打包）
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -ntp verify
      - name: 失败时把测试失败摘要写成注解（匿名也能看）
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          n = 0
          for f in sorted(glob.glob('target/surefire-reports/TEST-*.xml')):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for tag in ('failure', 'error'):
                      e = tc.find(tag)
                      if e is None or n >= 20:
                          continue
                      msg = (e.get('message') or '')[:300].replace('\n', ' ')
                      detail = (e.text or '')[:1800].replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                      print(f"::error title={tc.get('classname')}.{tc.get('name')}::{msg}%0A{detail}")
                      n += 1
          print('failed tests reported:', n)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          if-no-files-found: error

  backend-mysql:
    name: 后端（MySQL 8 测试）
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: quiz_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/quiz_test?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -ntp verify
      - name: 失败时把测试失败摘要写成注解（匿名也能看）
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          n = 0
          for f in sorted(glob.glob('target/surefire-reports/TEST-*.xml')):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for tag in ('failure', 'error'):
                      e = tc.find(tag)
                      if e is None or n >= 20:
                          continue
                      msg = (e.get('message') or '')[:300].replace('\n', ' ')
                      detail = (e.text or '')[:1800].replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                      print(f"::error title={tc.get('classname')}.{tc.get('name')}::{msg}%0A{detail}")
                      n += 1
          print('failed tests reported:', n)
          PY

  admin:
    name: 管理后台（类型检查 + 测试 + 构建）
    needs: detect
    if: needs.detect.outputs.admin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run test --if-present
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: admin/dist
          if-no-files-found: error

  app:
    name: 手机 App（类型检查 + H5 和 App 资源构建）
    needs: detect
    if: needs.detect.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run test --if-present
      - run: npm run build:h5
      - run: npm run build:app
      - uses: actions/upload-artifact@v4
        with:
          name: app-h5
          path: app/dist/build/h5
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: app-resources
          path: app/dist/build/app
          if-no-files-found: error

  android:
    name: Android 套壳（单元测试 + debug 包，不签名）
    needs: detect
    if: needs.detect.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties
      - name: 装编译要的 SDK 平台和 build-tools（运行环境自带的可能还没有 37）
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - run: ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

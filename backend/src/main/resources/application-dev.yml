# 本地开发：H2 文件库（MySQL 兼容模式），启动时导入示例题库。这里的账号和密钥只用于本机开发。
spring:
  datasource:
    url: jdbc:h2:file:./data/quiz;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=FALSE
    username: sa
    password: ""

app:
  jwt:
    secret: dev-only-jwt-secret-do-not-use-in-production-0123456789
  admin:
    username: admin
    password: admin123
  seed:
    enabled: true
  upload:
    dir: ./uploads
  cors:
    allowed-origin-patterns:
      - http://localhost:*
      - http://127.0.0.1:*

# 生产：全部从环境变量读。缺必填项时启动失败，一次列出缺哪些（ProdEnvironmentCheck）。
server:
  # 部署在 Nginx / Caddy 后面：按 X-Forwarded-Proto / -Host / -Prefix 生成重定向等地址
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:50}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

app:
  jwt:
    secret: ${JWT_SECRET:}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
  seed:
    enabled: ${APP_SEED_ENABLED:false}
  upload:
    dir: ${UPLOAD_DIR:/var/lib/quiz/uploads}
  cors:
    allowed-origin-patterns: []
  release:
    android:
      latest-version: ${APP_RELEASE_ANDROID_LATEST_VERSION:1.0.0}
      min-version: ${APP_RELEASE_ANDROID_MIN_VERSION:1.0.0}
      download-url: ${APP_RELEASE_ANDROID_DOWNLOAD_URL:}
      notes: ${APP_RELEASE_ANDROID_NOTES:}
    ios:
      latest-version: ${APP_RELEASE_IOS_LATEST_VERSION:1.0.0}
      min-version: ${APP_RELEASE_IOS_MIN_VERSION:1.0.0}
      download-url: ${APP_RELEASE_IOS_DOWNLOAD_URL:}
      notes: ${APP_RELEASE_IOS_NOTES:}

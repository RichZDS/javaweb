# 部署时作为 /etc/nginx/conf.d/default.conf（deploy.sh 会放到 ./nginx/default.conf）。
# 外层 Caddy 把 https://<服务器>/quiz/... 原样（保留 /quiz 前缀）转发到 127.0.0.1:18090。
#   /quiz/api/、/quiz/uploads/  → 后端（去掉 /quiz 前缀）
#   /quiz/admin/                → 管理后台静态文件（SPA 回退到 index.html）
#   /quiz/download/             → Android 安装包和下载页
#   其余 /quiz/                 → H5 版 App 静态文件（SPA 回退到 index.html）

# 外层 Caddy 已经带了 X-Forwarded-Proto 就沿用，否则用本层的协议
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream quiz_backend {
    server backend:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 6m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    location = / {
        return 302 /quiz/;
    }
    location = /quiz {
        return 301 /quiz/;
    }

    # ^~：前缀命中后不再匹配下面的静态资源正则（否则 /quiz/uploads/x.png 会被当本地文件找）
    location ^~ /quiz/api/ {
        proxy_pass http://quiz_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /quiz;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /quiz/uploads/ {
        proxy_pass http://quiz_backend/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        expires 7d;
    }

    location ^~ /quiz/download/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";

        # 安装包用 Android 的类型，有些手机浏览器才会直接提示安装
        location ~* \.apk$ {
            types { }
            default_type application/vnd.android.package-archive;
            add_header Cache-Control "no-cache";
        }
    }

    # 入口 index.html 不缓存，发版后马上生效
    location = /quiz/index.html {
        add_header Cache-Control "no-cache";
    }
    location = /quiz/admin/index.html {
        add_header Cache-Control "no-cache";
    }

    location /quiz/admin/ {
        try_files $uri $uri/ /quiz/admin/index.html;
    }

    # 带哈希的构建产物长期缓存
    location ~* ^/quiz/.+\.(?:js|css|png|jpe?g|gif|svg|webp|ico|woff2?|ttf)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /quiz/ {
        try_files $uri $uri/ /quiz/index.html;
    }
}

# 版本号和网址都在这里改；也可以命令行覆盖：./gradlew -PquizVersionName=1.0.1 -PquizVersionCode=101 ...
# versionCode 必须比上一版大，否则手机上不能覆盖安装。
quizVersionName=1.0.0
quizVersionCode=100
# 套壳打开的网页版地址（站内链接以它的路径为界，站外的交给系统浏览器）
quizHomeUrl=https://43.142.166.108/quiz/

# 本机内存紧，构建完就退出，不留常驻的 Gradle 守护进程
org.gradle.daemon=false
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
